<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Svampeguiden">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<title>Svampeguiden</title>
<style>
/* =====================================================================
   SVAMPEGUIDEN — visuelt system, pass 02
   Grundverdenen er papir og blæk. Farve optræder kun i to skalaer:
   LILLE (et mærke) eller STOR (en hel flade). Aldrig mellemstore kasser.

   PAPER     #FFFFFF  baggrund                         – alt
   INK       #141414  tekst, piktogrammer, primærknap  – alt
   INK-2     #3B3B3B  sekundær brødtekst               – tekst
   GREY      #737373  metadata, billedtekster          – lille tekst (ikke på smørgul)
   RULE      #E3E3E1  hårlinjer                        – kun ved reelle overgange
   WASH      ink 5,5 % tonet flade (små interaktive flader, fotopladsholdere)
   MOSS      #A3AF84  "God spisesvamp", skov-filtre, I skoven nu-fladen
                      lille mærke / én stor flade på start. Aldrig tekst, streger.
   BUTTER    #F6E8B1  køkkenet – hele siden. Mærker for køkkenfiltre.
   RUST      #B4432A  fare: dødeligt/meget giftig (mærke, artsflade, STOP).
                      Aldrig pynt, skillelinjer eller almindelige knapper.
   RUST-PALE #F4DCD3  mærke for "Giftig" (tekst RUST-INK #8C2F1A)
   CHESTNUT  #7E5536  redaktionel flade: sidefoden. Ikke en værktøjslinje.
   LILAC     #CDD2E0  tid: sæsonfilter. Kun mærke.

   Typografi — serif = navne og fortælling, sans = instrumentet
     display  serif 44–60 / .98   artsnavn, sidetitel
     state    serif 32 / 1.06     udsagn, spørgsmål
     obs      serif 24 / 1.22     observation, sanseindtryk
     read     serif 19 / 1.45     redaktionel prosa
     cat      sans 28 / 1.08 500  kategorier (indgange, filtre)
     body     sans 16 / 1.5
     meta     sans 13 / 1.4       billedtekster, metadata
     label    sans 11 / 600 / versal +.11em
   Afstand: 4 8 12 16 24 32 48 72 112 · spalte 20 px
   ===================================================================== */
:root{
  --paper:#FFFFFF; --ink:#141414; --ink-2:#3B3B3B; --grey:#737373; --grey-2:#A6A6A6;
  --rule:#E3E3E1; --wash:rgba(20,20,20,.055);
  --moss:#A3AF84; --butter:#F6E8B1; --rust:#B4432A; --rust-pale:#F4DCD3; --rust-ink:#8C2F1A;
  --chestnut:#7E5536; --lilac:#CDD2E0;
  --bg:var(--paper);
  --serif:"Times New Roman",Times,serif;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --fs-3xl:clamp(44px,12.4vw,60px);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:56px;--s9:80px;
  --g:20px; --r:10px; --top:52px; --tab:54px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;transition:background-color .4s ease}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
img{display:block;max-width:100%}
h1,h2,h3,h4,p,dl,dd,figure{margin:0}
ul,ol{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- typografi ---------- */
.t-display{font:400 var(--fs-3xl)/.98 var(--serif);letter-spacing:-.022em;hyphens:manual}
.t-state{font:400 28px/1.1 var(--serif);letter-spacing:-.01em}
.t-obs{font:400 20px/1.4 var(--serif)}
.t-read{font:400 20px/1.4 var(--serif)}
.t-cat{font:500 26px/1.1 var(--sans);letter-spacing:-.02em}
.lbl{font:600 11px/1.3 var(--sans);letter-spacing:.11em;text-transform:uppercase}
.meta{font-size:13px;line-height:1.4;color:var(--grey)}
.la{font:italic 400 19px/1.25 var(--serif);color:var(--ink-2)}
.num{font:500 11px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--grey)}
.g{color:var(--grey)}
.pad{padding-left:var(--g);padding-right:var(--g)}
.arr{display:inline-block;flex:none;width:1.1em;height:1.1em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.arr path{vector-effect:non-scaling-stroke}

/* ---------- piktogrammer: 24-gitter, 1,5 px linje, fyldt = det, der tales om ---------- */
.pg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;flex:none;overflow:visible}
.pg *{vector-effect:non-scaling-stroke}
.pg .f{fill:currentColor}
.pg .d{stroke:none}
.pg.lg{stroke-width:1.75}
.lock{display:flex;align-items:center;gap:10px}
.lock-n{display:flex;align-items:center;gap:10px}
.lock-n .num{min-width:18px}

/* ---------- hoved, navigation, fod ---------- */
#top{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:var(--sat);box-shadow:0 1px 0 transparent;transition:box-shadow .2s,background-color .4s}
#top.scrolled{box-shadow:0 1px 0 var(--rule)}
#top .in{max-width:620px;margin:0 auto;height:var(--top);display:flex;align-items:center;gap:4px;padding:0 14px 0 var(--g)}
#back{display:flex;align-items:center;width:34px;height:44px;margin-left:-8px}
#back svg{width:20px;height:20px}
#wm{font:700 12px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;text-decoration:none}
#ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 11px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase}
#top.root #back,#top.root #ttl{display:none}
#top.root #wm{flex:1}
#top:not(.root) #wm{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:37px;padding:0 17px;border-radius:999px;background:var(--wash);color:var(--ink);font:600 11.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
#tabs{position:-webkit-sticky;position:sticky;bottom:0;z-index:30;background:var(--bg);box-shadow:0 -1px 0 var(--rule);padding-bottom:var(--sab);transition:background-color .4s}
#tabs .in{max-width:620px;margin:0 auto;display:flex}
#tabs a{position:relative;flex:1;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-decoration:none;color:var(--grey)}
#tabs a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linejoin:round;stroke-linecap:round}
#tabs a span{font:500 10px/1 var(--sans);letter-spacing:.02em}
#tabs a.on{color:var(--ink)}
#tabs a.on span{font-weight:700}
#tabs a.on::before{content:"";position:absolute;top:0;left:50%;width:20px;height:2px;margin-left:-10px;background:var(--ink)}
#tabs a .n{position:absolute;top:7px;left:calc(50% + 7px);min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--ink);color:#fff;font:700 9.5px/15px var(--sans);text-align:center}
/* Navigationen er en del af sidens flow (sticky, ikke fixed): den kan aldrig ligge over sidefoden,
   og den følger Safaris skiftende værktøjslinjer. Body fylder mindst skærmen, så den står i bunden. */
body{display:flex;flex-direction:column;min-height:100vh;min-height:100svh}
main{flex:1 0 auto;width:100%}
main{max-width:620px;margin:0 auto}
.view{animation:vin .18s ease-out;min-height:60vh;min-height:60svh}
@keyframes vin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.view,body{animation:none;transition:none}}
.foot{margin-top:var(--s9);background:var(--chestnut);color:#fff;padding:var(--s6) var(--g) var(--s6)}
.foot .wmk{font:700 12px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase}
.foot p{margin-top:var(--s4);font:400 21px/1.35 var(--serif);max-width:24em}
.foot a{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin-top:var(--s2);font:500 15px/1 var(--sans);text-decoration:none}
.foot small{display:block;margin-top:var(--s5);font:500 11px/1.4 var(--sans);letter-spacing:.04em;opacity:.72}

/* ---------- sidehoved, sektioner ---------- */
.ph-head{padding:var(--s7) var(--g) 0}
.ph-head>.lbl{margin-bottom:var(--s4);color:var(--grey)}
.ph-head.danger>.lbl{color:var(--rust)}
.intro{margin-top:var(--s5);color:var(--ink-2);max-width:32em}
.intro b{font-weight:600;color:var(--ink)}
.sec{margin-top:var(--s8);padding:0 var(--g)}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 var(--s5);font:600 11px/1.3 var(--sans);letter-spacing:.11em;text-transform:uppercase}
.sh a{font:500 13px/1 var(--sans);letter-spacing:0;text-transform:none;text-decoration:none;color:var(--grey)}
.say{margin:var(--s5) var(--g) 0;max-width:34em}
.say b{font-weight:600}
.say.danger b{color:var(--rust)}
.say .txt-link{display:flex;color:var(--rust)}
.count{padding:0 var(--g) var(--s4);font-size:13px;color:var(--grey)}
.aside{padding:var(--s6) var(--g) 0;font-size:14px;color:var(--grey)}
.aside a{color:var(--ink)}
.note{margin:var(--s8) var(--g) 0}
.note .lbl{display:block;margin-bottom:var(--s3);color:var(--grey)}
.note p{font-size:15px;color:var(--ink-2)}

/* ---------- mærker (tags) ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--wash);color:var(--ink);font:600 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;vertical-align:middle}
.st-plain{display:inline-block;font:600 10.5px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.ix .st-plain{margin-top:10px}
.sp-id .st-plain{padding-top:4px}
.tag.moss{background:var(--moss)}
.tag.butter{background:var(--butter)}
.tag.lilac{background:var(--lilac)}
.tag.rust{background:var(--rust);color:#fff}
.tag.rust-pale{background:var(--rust-pale);color:var(--rust-ink)}
.tag.paper{background:#fff;color:var(--rust)}
button.tag{height:30px;padding:0 8px 0 12px;font-size:11px}
button.tag .x{font:400 15px/1 var(--sans);opacity:.6}

/* ---------- knapper: primær · sekundær · tekst · kompakt ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:var(--r);background:var(--wash);color:var(--ink);font:500 16px/1.2 var(--sans);text-decoration:none;text-align:center;position:relative}
.btn.fill{background:var(--ink);color:#fff}
.btn.big{width:100%;min-height:64px;border-radius:8px;justify-content:space-between;padding:0 22px;background:var(--ink);color:#fff;font-size:18px}
.btn.big .bl{display:flex;align-items:center;gap:14px}
.btn[disabled]{opacity:.5}
.btn-row{display:flex;gap:8px;padding:var(--s6) var(--g) 0}
.btn-row .btn{flex:1}
.btn-row.in{padding:0}
.btn-col{display:grid;gap:8px;padding:var(--s6) var(--g) 0}
.cta-wrap{padding:var(--s7) var(--g) 0}
.txt-link{display:inline-flex;align-items:center;gap:8px;min-height:44px;font:500 15px/1.2 var(--sans);text-decoration:none;color:inherit}
.quiet{display:flex;align-items:center;gap:10px;min-height:48px;margin:var(--s6) var(--g) 0;font:500 15px/1.2 var(--sans);text-decoration:none;color:var(--ink-2)}
.more{margin:var(--s8) var(--g) 0}
.more>.lbl{margin-bottom:var(--s2);color:var(--grey)}
.more a{display:flex;align-items:baseline;gap:10px;min-height:48px;padding:13px 0;border-bottom:1px solid var(--rule);font:500 16px/1.3 var(--sans);text-decoration:none}
.more a .m{font-size:13px;font-weight:400;color:var(--grey)}
.more a .arr{margin-left:auto}
.util{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin:var(--s7) var(--g) 0}
.util a{display:flex;align-items:baseline;gap:8px;padding:9px 0;font:500 16px/1.3 var(--sans);text-decoration:none}
.util a .m{font-size:13px;font-weight:400;color:var(--grey)}

/* ---------- fotos og annotationer ---------- */
.ph{position:relative;overflow:hidden;background:var(--wash)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.none{background:rgba(20,20,20,.03)}
.ph.empty,.ph.none{display:flex;align-items:center;justify-content:center;color:var(--grey)}
.ph.empty span{font:500 11px/1.3 var(--sans);color:var(--grey);text-align:center;padding:6px}
.ann{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ann .o{fill:none;stroke:#141414;stroke-width:3;vector-effect:non-scaling-stroke}
.ann .i{fill:none;stroke:#fff;stroke-width:3;vector-effect:non-scaling-stroke}
.ann-m{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#141414;color:#fff;font:600 9.5px/16px var(--sans);text-align:center;pointer-events:none}
.lg{display:inline-flex;align-items:center;gap:7px;margin-right:14px;color:var(--ink);font-weight:500}
.lg i{display:inline-block;width:15px;height:15px;border-radius:50%;background:var(--ink);color:#fff;font:600 9px/15px var(--sans);font-style:normal;text-align:center}
.gal{position:relative}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.gal-track::-webkit-scrollbar{display:none}
.gal-track .slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always}
.gal-track .ph{aspect-ratio:4/3}
.gal-meta{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px var(--g) 0}
.gal-meta .v{color:var(--ink)}
.gal-meta .cap{grid-column:1/-1;font-size:13px;line-height:1.45;color:var(--ink-2)}
.gal-n{font:500 11px/1.3 var(--sans);font-variant-numeric:tabular-nums;color:var(--grey)}
.credit{padding:4px var(--g) 0;font-size:11px;line-height:1.35;color:var(--grey)}
.arr-btn{position:absolute;top:0;width:48px;height:0;padding-top:37.5%;display:none}
.arr-btn button{position:absolute;top:calc(100% - 22px);width:40px;height:44px;background:rgba(255,255,255,.9);font-size:22px}
.arr-btn.l{left:0}.arr-btn.r{right:0}.arr-btn.r button{right:0}
@media (hover:hover) and (min-width:700px){.arr-btn{display:block}.gal.single .arr-btn{display:none}}

/* ---------- artssiden ---------- */
.sp-id{padding:var(--s7) var(--g) var(--s6)}
.sp-id .la{margin-top:var(--s3)}
.sp-id .syn{margin-top:var(--s1);font-size:13px;color:var(--grey)}
.sp-id .st-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s5)}
.sp-id .st-note{margin-top:10px;font-size:13px;color:var(--grey)}
.sp-id .warn{margin-top:var(--s5);max-width:30em}
.sp-id .warn b{color:var(--rust);font-weight:400}
.sp-id.field{background:var(--rust);color:#fff;padding-bottom:var(--s7)}
.sp-id.field .la{color:#fff}
.sp-id.field .syn{color:rgba(255,255,255,.8)}
.sp-id.field .warn b{color:#fff;font-weight:700;font-family:var(--sans);font-size:15px;letter-spacing:.02em}
.lede{padding:var(--s6) var(--g) 0;max-width:36em}
.sig-w{margin:var(--s7) var(--g) 0}
.sig-w>.lbl{color:var(--grey)}
.sig{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;margin:var(--s4) 0 0;padding:0}
.sig li{font:500 15px/1.25 var(--sans)}
.kt+.kt{margin-top:var(--s7)}
.kt-ph.detail{margin-left:0;margin-right:0}
.kt-ph.detail figcaption{padding-left:0;padding-right:0}
.kt-h .lbl{color:var(--ink)}
.kt .t-obs{margin-top:var(--s3);font:400 19px/1.4 var(--sans);letter-spacing:-.005em}
.kt .nb{display:block;margin-top:var(--s2);font-size:13px;line-height:1.45;color:var(--grey)}
.kt-more{margin-top:var(--s4);font-size:16px;color:var(--ink-2)}
.kt-more b{font-weight:600;color:var(--ink)}
.kt-ph{margin:var(--s5) calc(-1 * var(--g)) 0}
.kt-ph .ph{aspect-ratio:4/3}
.kt-ph figcaption{padding:10px var(--g) 0;font-size:13px;line-height:1.45;color:var(--ink-2)}
.kt-ph figcaption .lgs{display:block;margin-bottom:4px}
.anat{margin-top:var(--s7)}
.anat summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:10px;min-height:44px;font:500 15px/1 var(--sans)}
.anat summary::-webkit-details-marker{display:none}
.anat summary::after{content:"+";font:300 20px/1 var(--sans)}
.anat[open] summary::after{content:"–"}
.plate{margin-top:var(--s5)}
.plate .dia{width:78%;max-width:320px}
.plate figcaption{margin-top:var(--s3)}
.dia svg{display:block;width:100%;height:auto}
.hab-r{margin:0 0 var(--s3);font:500 16px/1.3 var(--sans)}
.hab{margin-top:var(--s5);color:var(--ink-2)}
.sec .meta{margin-top:var(--s3)}
.season{margin-top:var(--s7)}
.season>.lbl{color:var(--grey)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:var(--s3)}
.months span{position:relative;padding-top:9px;text-align:center;font:500 10.5px/1 var(--sans);color:var(--grey-2);border-top:6px solid var(--wash)}
.months span.on{border-top-color:var(--ink);color:var(--ink)}
.months span.now{font-weight:800}
.months span.now::after{content:"";position:absolute;left:50%;bottom:-10px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink)}
.ctx{margin-top:var(--s5);font-size:14px;color:var(--grey)}
.ctx.on{color:var(--ink);font-weight:500}
.sense{display:grid;gap:var(--s6)}
.sense dt{color:var(--grey)}
.sense dd{margin-top:var(--s2)}
.sense dd p{margin-top:var(--s2);font-size:15px;color:var(--ink-2);max-width:32em}
.to-kitchen{display:block;margin-top:var(--s9);padding:var(--s6) var(--g) var(--s7);background:var(--butter);text-decoration:none}
.to-kitchen .lbl{color:var(--ink-2)}
.to-kitchen .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.to-kitchen .s{display:block;margin-top:var(--s3);font-size:14px;color:var(--ink-2)}

/* ---------- indeks (artslister, resultater, fund) ---------- */
.ix{margin:0 var(--g)}
.ph-head+.ix,.ph-head+.flt{margin-top:var(--s7)}
.ix>a{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:start;padding:16px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.ix .ph{aspect-ratio:4/5}
.ix .t{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.ix .num{margin-bottom:8px}
.ix .nm{font:400 22px/1.12 var(--serif);letter-spacing:-.005em}
.ix .nm.unk{font-style:italic}
.ix .la2{margin-top:3px;font:italic 15px/1.3 var(--serif);color:var(--grey)}
.ix .tag{margin-top:12px}
.ix .m{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;line-height:1.35;color:var(--ink-2)}
.ix .m+.m{margin-top:4px}
.ix .kd{margin-top:10px;font-size:14px;line-height:1.4;color:var(--ink-2)}
.ix .found{margin-left:6px}
.ix.sq>a{grid-template-columns:72px 1fr}
.ix.sq .ph{aspect-ratio:1/1}
.ix .q{margin-top:6px;font-size:14px;line-height:1.4;color:var(--ink-2)}

/* ---------- filtre: kategorier som store ord, valg først når de åbnes ---------- */
.flt{margin:0 var(--g)}
.flt-h{display:flex;justify-content:space-between;align-items:center;width:100%;padding:18px 0 17px;border-top:1px solid var(--rule)}
.flt-h .chev{width:18px;height:18px;transition:transform .2s}
.flt-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.flt-h .k{font-size:13px;font-weight:500;letter-spacing:0;color:var(--grey);margin-left:auto;margin-right:12px}
.flt-b{padding:4px 0 var(--s6)}
.flt-c+.flt-c{margin-top:var(--s5)}
.flt-c>.lbl{display:block;margin-bottom:10px;color:var(--grey)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border-radius:999px;background:var(--wash);font:500 15px/1 var(--sans)}
.pills button.on{background:var(--ink);color:#fff}
.pills button.dk{background:none;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink-2)}
.pills button.dk.on{background:none;box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.pills i{display:block;width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.flt-end{border-top:1px solid var(--rule)}
.flt-act{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:var(--s4) var(--g) 0}
.flt-act .clr{margin-left:4px;font:500 13px/1 var(--sans);color:var(--grey);text-decoration:underline;text-underline-offset:3px;min-height:30px}
.res-n{margin:var(--s6) var(--g) var(--s3);font-size:13px;color:var(--grey)}

/* ---------- start ---------- */
.home-area{padding:var(--s6) var(--g) 0}
.home-area>.lbl{color:var(--grey)}
.area-name{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;width:100%;min-height:48px;font:inherit;letter-spacing:inherit;text-align:left}
.area-name .an{min-width:0}
.area-name .nw{white-space:nowrap}
.area-chev{flex:none;width:.44em;height:.44em;margin-top:.3em;stroke-width:1.6}
.area-chev path{vector-effect:non-scaling-stroke}
.home-area .meta{margin-top:var(--s3);font-size:14px}
.num.rust{color:var(--rust);font-weight:700}
.home-area>.lbl{color:var(--grey)}
.home-area .t-display{margin-top:var(--s2)}
.home-area .txt-link{margin-top:var(--s2);color:var(--ink-2)}
.hm-hero{display:block;margin-top:var(--s6);text-decoration:none}
.hm-hero .ph{aspect-ratio:4/5}
.hm-now{display:block;background:var(--moss);padding:30px var(--g) 38px;text-decoration:none}
.hm-now .cap{font-size:13px;color:var(--ink)}
.hm-now .cap i{font-family:var(--serif);font-size:15px}
.hm-now .lbl{display:block;margin-top:var(--s2)}
.hm-now .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:var(--s3)}
.hm-go{margin:40px var(--g) 0}
.hm-go a{display:grid;grid-template-columns:30px 1fr auto;gap:6px 0;align-items:baseline;padding:20px 0 22px;border-top:1px solid var(--rule);text-decoration:none}
.hm-go>.lbl{margin-bottom:10px;color:var(--grey)}
.hm-go>.lbl+a{border-top:0;padding-top:0}
.hm-go .num{grid-column:1;grid-row:1}
.hm-go .t-cat{grid-column:2}
.hm-go .arr{grid-column:3;grid-row:1;font-size:20px}
.hm-go .s{grid-column:2/4;font-size:15px;color:var(--ink-2)}
.hm-go .alpha{grid-column:2/4;display:flex;gap:14px;margin-top:10px}

/* ---------- lær at se ---------- */
.alphabet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:var(--s7) var(--g) 0}
.alphabet a{display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1/1;padding:14px;border-radius:12px;background:var(--wash);text-decoration:none;font:500 14px/1.2 var(--sans)}
.lesson{margin-top:var(--s9);padding:0 var(--g)}
.lesson .t-state{margin-top:0}
.tech{margin-top:var(--s2);font-size:13px;color:var(--grey)}
.lesson .t-read{margin-top:var(--s4);max-width:34em}
.lesson-fig{display:grid;grid-template-columns:40% 1fr;gap:2px;margin:var(--s5) calc(-1 * var(--g)) 0;align-items:center}
.lesson-fig .dia{padding:0 8px 0 var(--g)}
.lesson-fig .ph{aspect-ratio:4/3}
.ex{margin-top:var(--s3);font-size:14px;color:var(--grey)}
.ex a{color:var(--ink)}
.lesson .btn-row{padding:var(--s6) 0 0}

/* ---------- se forskellen ---------- */
.pl{margin-top:var(--s6)}
.pl>a{display:block;padding-bottom:var(--s7);text-decoration:none}
.pl>a.txt-only{padding:0 var(--g) var(--s6)}
.pl .q .arr{margin-left:6px}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.ab .ph{aspect-ratio:1/1}
.ab.tall .ph{aspect-ratio:3/4}
.pl .t{padding:12px var(--g) 0}
.pl .nm{display:block;font:400 22px/1.15 var(--serif)}
.pl .nm .vs{width:.8em;height:.8em;margin:0 .22em;vertical-align:-.06em}
.pl .q{display:block;margin-top:6px;font-size:14px;color:var(--ink-2)}
.ab-names{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:14px var(--g) 0}
.ab-names a{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-decoration:none}
.ab-names .nm{font:400 22px/1.12 var(--serif)}
.decisive{padding:var(--s8) var(--g) 0}
.decisive>.lbl{color:var(--grey)}
.decisive .t-state{margin-top:var(--s4)}
.decisive p.k{margin-top:var(--s4);color:var(--ink-2);max-width:32em}
.cmp-head{position:sticky;top:calc(var(--top) + var(--sat));z-index:5;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);box-shadow:0 1px 0 var(--rule);transform:translateY(-100%);opacity:0;transition:.2s;pointer-events:none}
.cmp-head.show{transform:none;opacity:1;pointer-events:auto}
.cmp-head a{display:block;padding:10px var(--g);text-decoration:none;font:400 16px/1.2 var(--serif)}
.cmp-row{margin-top:var(--s8)}
.cmp-row>.lock-n{padding:0 var(--g)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:var(--s4)}
.pair .ph{aspect-ratio:4/3}
.txt{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:12px var(--g) 0}
.txt p{font-size:15px;line-height:1.45}
.txt p .pg{display:block;margin-bottom:8px}

/* ---------- undersøg ---------- */
.key-top{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:var(--s4) var(--g) 0}
.key-top .lbl{color:var(--grey)}
.key-top .txt-link{font-size:14px;color:var(--ink-2)}
.key-prog{display:flex;gap:4px;padding:8px var(--g) 0}
.key-prog i{flex:1;height:2px;background:var(--rule)}
.key-prog i.on{background:var(--ink)}
.key-q{padding:var(--s7) var(--g) 0}
.key-q>.lbl{color:var(--grey)}
.key-q .t-state{margin-top:var(--s3)}
.key-q .intro{margin-top:var(--s3);font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:var(--s6) var(--g) 0}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:136px;padding:16px;border-radius:4px;background:rgba(20,20,20,.035);text-align:left}
.tile b{display:block;font:500 18px/1.2 var(--sans)}
.tile small{display:block;margin-top:4px;font-size:13px;line-height:1.35;color:var(--ink-2)}
.tile:active{background:var(--ink);color:#fff}
.tile:active small{color:rgba(255,255,255,.7)}
.tile .sw{width:40px;height:40px}
.rows{margin:var(--s6) var(--g) 0;border-top:1px solid var(--rule)}
.rowo{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:14px 0;border-bottom:1px solid var(--rule)}
.rowo b{display:block;font:500 19px/1.25 var(--sans)}
.rowo small{display:block;margin-top:3px;font-size:13px;line-height:1.35;color:var(--grey)}
.rowo .arr{margin-left:auto;color:var(--grey)}
.rowo:active{color:var(--grey)}
.opt.dk{color:var(--grey)}
.tiles .opt.dk{grid-column:1/-1;min-height:56px;flex-direction:row;align-items:center;justify-content:space-between;padding:0;margin-top:8px;border-radius:0;background:none;border-bottom:1px solid var(--rule);color:var(--ink-2)}
.tiles .opt.dk b{font:500 17px/1.2 var(--sans)}
.tiles .opt.dk:active{background:none;color:var(--grey)}
.sw{display:block;width:28px;height:28px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.given{display:flex;flex-wrap:wrap;gap:6px;padding:var(--s5) var(--g) 0}
.res-ix{margin-top:var(--s6)}
.sep dt{margin-top:var(--s5)}
.sep dt:first-child{margin-top:0}
.sep dd{margin-top:var(--s2)}
.sep dd p{margin:0 0 4px}
.sep dd b{font-weight:600}

/* ---------- stop: én fuld rustflade ---------- */
#stop{position:fixed;inset:0;z-index:60;background:#fff;overflow-y:auto;padding-bottom:var(--sab)}
#stop .in{max-width:620px;margin:0 auto}
.stop-sign{background:var(--rust);color:#fff;padding:calc(var(--sat) + 36px) var(--g) var(--s6)}
.stop-sign h1{font:700 88px/.82 var(--sans);letter-spacing:-.04em}
.stop-sign p{margin-top:var(--s5);font:400 22px/1.3 var(--serif);max-width:20em}
.stop-body{padding:var(--s6) var(--g) var(--s7)}
.stop-body .sh{margin-top:var(--s7)}
.stop-body ol{list-style:none;padding:0}
.stop-body li{display:grid;grid-template-columns:22px 28px 1fr;gap:10px;align-items:start;padding:14px 0;border-bottom:1px solid var(--rule)}
.stop-body li .num{padding-top:5px}
.stop-body li b{display:block;font-weight:600}
.stop-body .pair{margin:var(--s6) calc(-1 * var(--g)) 0}
.stop-body .txt{padding:10px 0 0}
.stop-body .meta{margin-top:var(--s5)}
.stop-body .btn-col{padding:var(--s6) 0 0}

/* ---------- quiz ---------- */
.qz-q{padding:var(--s6) var(--g) 0}
.qz-img{margin-top:var(--s5)}
.qz-img .ph{aspect-ratio:4/3}
.qz-q+.pair{margin-top:var(--s5)}
.txt .nm{font:400 17px/1.2 var(--serif)}
.qz-opt{text-align:left}
.qz-opt span{font:500 17px/1.3 var(--sans)}
.qz-opt.ok span{font-weight:700}
.qz-opt.ok::after{content:"Rigtigt";margin-left:auto;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--moss);font:600 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.qz-opt.no{color:var(--grey);text-decoration:line-through;text-decoration-thickness:1px}
.qz-opt[disabled]{cursor:default}
.qz-exp{margin:var(--s6) var(--g) 0;max-width:34em}
.qz-exp .lbl{display:block;margin-bottom:var(--s2);color:var(--grey)}
.qz-score{font:400 clamp(96px,32vw,150px)/.85 var(--serif);letter-spacing:-.04em}

/* ---------- fund: feltnotesbog ---------- */
.fd-day{display:flex;justify-content:space-between;align-items:baseline;margin:var(--s8) var(--g) var(--s3)}
.fd-day .lbl{color:var(--grey)}
.fd-slots{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:var(--s6)}
.fd-slot .ph{display:block;width:100%;aspect-ratio:1/1}
.fd-slot figcaption{display:flex;align-items:center;gap:8px;padding:10px 12px 14px}
.fd-rows{margin:var(--s6) var(--g) 0}
.fd-row{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--rule)}
.fd-row>.lbl{padding-top:4px;color:var(--grey)}
.fd-row p{display:flex;align-items:center;gap:10px}
.fd-id{margin:var(--s7) var(--g) 0}
.fd-id>.lbl{color:var(--grey)}
.fd-id .t-state{margin-top:var(--s3)}
.fd-id .t-state.unk{font-style:italic}
.fd-id .meta{margin-top:var(--s2)}
.del{color:var(--grey);font-size:14px}
.empty-st{padding:var(--s7) var(--g) 0}
.empty-st .pg{color:var(--grey-2)}
.empty-st .t-obs{margin-top:var(--s5);max-width:20em}

/* ---------- registrér ---------- */
.rg-top{display:flex;justify-content:space-between;align-items:center;padding:var(--s4) var(--g) 0}
.rg-top>.lbl{color:var(--grey)}
.rg-top button{min-height:44px;font-size:14px;color:var(--ink-2)}
.rg-prog{list-style:none;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0 0;padding:0 var(--g)}
.rg-prog button{width:100%;padding:9px 0 4px;border-top:2px solid var(--rule);font:500 11px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--grey);text-align:left}
.rg-prog li.done button{border-top-color:var(--grey);color:var(--ink)}
.rg-prog li.cur button{border-top-color:var(--ink);color:var(--ink);font-weight:700}
.rg-q{padding:var(--s7) var(--g) 0}
.rg-q .t-state{margin-top:var(--s4)}
.rg-q p{margin-top:var(--s3);color:var(--ink-2);max-width:32em}
.rg-q p.dim{font-size:14px;color:var(--grey)}
.rg-shot{position:relative;margin-top:var(--s5);aspect-ratio:4/3;background:var(--wash);overflow:hidden}
.rg-shot img{width:100%;height:100%;object-fit:cover}
.rg-cam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer}
.rg-cam b{font:500 16px/1 var(--sans)}
.rg-cam input,.rg-act label input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.rg-act{display:flex;gap:8px;padding:12px var(--g) 0}
.rg-act .btn{flex:1}
.rg-act label{cursor:pointer}
.rg-note{padding:12px var(--g) 0;font-size:13px;color:var(--grey)}
.rg-obs{padding:var(--s7) var(--g) 0}
.rg-obs .sh{margin-bottom:var(--s4)}
.rg-id{display:grid;gap:8px;padding:var(--s6) var(--g) 0}
.rg-id button{padding:16px 18px;border-radius:12px;background:var(--wash)}
.rg-id button b{display:block;font:500 17px/1.2 var(--sans)}
.rg-id button span{display:block;margin-top:4px;font-size:13px;color:var(--ink-2)}
.rg-id button.on{background:var(--ink);color:#fff}
.rg-id button.on span{color:rgba(255,255,255,.72)}
.rg-field{padding:var(--s5) var(--g) 0}
.rg-field .lbl{display:block;margin-bottom:8px;color:var(--grey)}
.rg-field p{font:400 22px/1.3 var(--serif)}
.rg-field select,.rg-field input,.rg-field textarea{width:100%;min-height:50px;padding:12px 14px;border:0;border-radius:var(--r);background:var(--wash);color:var(--ink);font:16px/1.4 var(--sans);-webkit-appearance:none}
.rg-field textarea{min-height:104px;resize:vertical}

/* ---------- område ---------- */
.area-h{margin:var(--s6) var(--g) var(--s6)}
.area-h .t-obs{margin-top:var(--s3)}
.area-h .meta{margin-top:var(--s2)}
.area-h .cov{margin-top:var(--s4);font-size:13px;color:var(--grey);max-width:32em}
body.noscroll{overflow:hidden}
#areaov{position:fixed;inset:0;height:100vh;height:100dvh;z-index:70;display:flex;flex-direction:column;overflow-y:auto;background:#fff;padding:calc(var(--sat) + 4px) 0 calc(var(--sab) + 12px);animation:vin .2s ease-out}
#areaov>*{flex-shrink:0}
#areaov>.map-wrap{position:relative;flex:1 0 260px;margin-top:0}
.map-wrap>#map{position:absolute;inset:0;margin:0;min-height:0}
.ov-top{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 8px 0 var(--g)}
.ov-top .lbl{color:var(--grey)}
.ov-x{display:flex;align-items:center;justify-content:center;width:44px;height:44px}
.ov-q{padding:4px var(--g) var(--s4)}
.ov-q h1{font:400 30px/1.06 var(--serif);letter-spacing:-.01em}
.ov-q>.lbl{display:block;margin-bottom:10px;color:var(--grey)}
.ov-q p{margin-top:8px;color:var(--ink-2)}
.ov-search{display:flex;align-items:center;margin:0 var(--g);border-bottom:1px solid var(--rule)}
.ov-search input{flex:1;min-width:0;height:40px;padding:0;border:0;border-radius:0;background:none;color:var(--ink);font:400 16px var(--sans);-webkit-appearance:none}
.ov-search input::placeholder{color:var(--grey)}
.ov-search button{width:40px;height:40px;margin-right:-10px;font-size:18px}
.ov-pos{min-height:36px;margin:0 var(--g);font:400 14px/1 var(--sans);color:var(--ink-2)}
.ov-res{max-height:34vh;max-height:34svh;overflow:auto;margin:0 var(--g)}
.ov-res p{padding:10px 0;font-size:14px;color:var(--grey)}
.ov-res>button,.presets button{display:block;width:100%;padding:11px 0;border-bottom:1px solid var(--rule)}
.ov-res b,.presets b{display:block;font-weight:500}
.ov-res span,.presets span{font-size:13px;color:var(--grey)}
#map{position:relative;flex:1;min-height:180px;margin-top:var(--s3);background:var(--wash)}
#map .leaflet-tile-pane{filter:grayscale(1) contrast(1.02) brightness(1.04)}
.map-msg{position:absolute;inset:0;overflow:auto;padding:20px var(--g) 84px;font-size:14px;color:var(--ink-2)}
.map-msg p{margin-bottom:12px}
.map-msg .lbl{display:block;color:var(--grey)}
.pin{background:var(--ink);border-radius:50%}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.75)!important}
.ov-bottom{padding:14px var(--g) 0}
.ov-sel .lbl{color:var(--grey)}
.ov-sel b{display:block;font:400 28px/1.1 var(--serif);letter-spacing:-.01em;overflow-wrap:break-word}
.ov-sel span{display:block;margin-top:2px;font-size:13px;color:var(--grey)}
.ov-rad{position:absolute;left:var(--g);right:var(--g);bottom:14px;z-index:500;display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:6px;background:rgba(255,255,255,.94);box-shadow:0 0 0 1px rgba(20,20,20,.14)}
.ov-rad button{min-height:44px;padding:5px 10px;border-radius:4px;font:500 14px/1.2 var(--sans);text-align:center}
.ov-rad button small{display:block;margin-top:1px;font:400 12px/1.2 var(--sans);color:var(--grey)}
.ov-rad button.on{background:var(--ink);color:#fff}
.ov-rad button.on small{color:rgba(255,255,255,.72)}
.ov-recent{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.ov-recent .lbl{color:var(--grey);margin-right:4px}
.ov-recent button{height:30px;padding:0 12px;border-radius:999px;background:var(--wash);font-size:13px}
.ov-use{width:100%;margin-top:14px;min-height:52px;border-radius:6px}
.ov-btns{display:flex;gap:8px;margin-top:12px}
.ov-btns .btn{flex:1;padding:0 10px}
.ov-btns.col{flex-direction:column;padding:var(--s6) var(--g) 0}
.ov-skip{min-height:44px;font:500 14px/1 var(--sans);color:var(--grey)}
.hab-opts{display:grid;gap:8px;padding:10px var(--g) 0}
.hab-opts button{min-height:56px;padding:0 18px;border-radius:12px;background:var(--wash);font:500 17px/1.2 var(--sans)}
.hab-opts button.on{background:var(--ink);color:#fff}

/* ---------- køkkenet: hele fladen bliver smørgul ---------- */
body.kitchen{--bg:var(--butter);--grey:#5F5A48;--rule:rgba(20,20,20,.14)}
.k-id{padding:var(--s7) var(--g) 0}
.k-id>.lbl{color:var(--grey)}
.k-id .t-display{margin-top:var(--s3)}
.k-id .la{margin-top:var(--s3)}
.k-safe{margin-top:var(--s5);font-size:14px;line-height:1.5;color:var(--ink-2);max-width:26em}
.k-safe b{font-weight:600;color:var(--ink)}
.k-sense{display:grid;gap:20px;margin:40px var(--g) 0}
.k-sense dt{color:var(--grey)}
.k-sense dd{margin-top:4px;font:400 28px/1.1 var(--serif);letter-spacing:-.01em}
.k-img{margin-top:var(--s8)}
.k-img .ph{aspect-ratio:4/5}
.k-img figcaption{padding:10px var(--g) 0;font-size:13px;color:var(--ink-2)}
.k-list{padding:0;list-style:none}
.k-list li{padding:6px 0}
.k-list li:first-child{padding-top:0}
.k-pair{font:400 24px/1.3 var(--serif)}
.k-pair+.meta{margin-top:var(--s3)}
.k-dish{border-top:1px solid var(--rule)}
.k-dish:last-child{border-bottom:1px solid var(--rule)}
.k-dish summary{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:22px 0 24px;cursor:pointer;list-style:none}
.k-dish summary::-webkit-details-marker{display:none}
.k-dish summary::after{content:"+";font:300 22px/1 var(--sans)}
.k-dish[open] summary::after{content:"–"}
.k-n{font:400 30px/1 var(--serif);font-variant-numeric:tabular-nums}
.k-t{display:flex;flex-direction:column;gap:6px}
.k-t .lbl{color:var(--grey)}
.k-t .nm{font:400 24px/1.15 var(--serif)}
.k-body{padding:0 0 var(--s6) 52px}
.k-body h4{margin:var(--s4) 0 var(--s2);color:var(--grey)}
.k-body ul,.k-body ol{padding-left:18px}
.k-body li{margin:0 0 6px}
.k-tip{margin-top:var(--s4)}
.k-tip .lbl{display:block;margin-bottom:6px;color:var(--grey)}

/* ---------- sikkerhed og kilder ---------- */
.big-safe{margin:var(--s6) var(--g) 0}
.prose{padding:0 var(--g)}
.prose .sh{margin-top:var(--s8)}
.prose p,.prose li{margin-top:8px;max-width:34em}
.prose ul{padding-left:18px}
.phone{display:block;margin-top:4px;font:400 36px/1.1 var(--serif);text-decoration:none}
.credits{margin-top:14px}
.credits div{padding:6px 0;border-top:1px solid var(--rule)}
.credits b{font-weight:600}

/* ---------- lysboks ---------- */
#lb{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;justify-content:center;background:#0E0E0E}
#lb img{width:100%;max-height:78vh;max-height:78dvh;object-fit:contain}
#lb .c{padding:14px var(--g);color:#EAEAEA;font-size:15px}
#lb .c small{display:block;margin-top:6px;font-size:11px;color:#9A9A9A}
#lb button{position:absolute;top:calc(var(--sat) + 10px);right:10px;width:48px;height:48px;color:#fff;font:300 30px/1 var(--sans)}

.sec .ix,.sec .pl{margin-left:0;margin-right:0}
.sec .pl>a .t{padding-left:0;padding-right:0}
.sec .pl .ab{margin:0 calc(-1 * var(--g))}
.sense .t-obs{display:block;font-size:24px;line-height:1.2}
.sec .say{margin-left:0;margin-right:0}
.ix>a.found-t{}
.ph-head .qz-score{margin-top:var(--s3)}
.pl .t{display:block}
.txt .lgs,.ex .lgs{display:block;margin-bottom:6px}
.home-area .t-display{font-size:clamp(48px,15vw,72px);letter-spacing:-.028em;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.fd-slot .ph.none{display:flex}

body.kitchen .sec{margin-top:48px}
.ov-search input:focus{outline:none}
.ov-search:focus-within{border-bottom-color:var(--ink)}
.ov-search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
@media (max-height:700px){#areaov>.map-wrap{flex-basis:220px}}
.hm-go .arr,.flt-h .arr{align-self:center}
.more a,.to-kitchen .row,.hm-now .row{align-items:center}
.arr.back{transform:rotate(180deg)}
.local-note{margin:var(--s6) var(--g) 0;color:var(--grey)}
.sec .local-note{margin:0 0 var(--s4)}
.local-note+.res-n{margin-top:var(--s2)}
.leaflet-top.leaflet-right .leaflet-control-attribution{margin:0}
.ov-bar{height:56px;gap:4px;padding:0 8px 0 var(--g)}
.ov-bar .ov-search{flex:1;margin:0}
.ov-ic{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none}
.ov-ic.busy{opacity:.35}
.ov-bar+.ov-res{margin-top:4px}

</style>

function monthRange(m){
  if(!m||!m.length) return ""; if(m.length>=12) return "hele året";
  const s=new Set(m); let a=m.find(x=>!s.has(x===1?12:x-1)); if(a==null) a=m[0];
  let b=a; while(s.has(b%12+1)&&b%12+1!==a) b=b%12+1;
  return a===b?MSHORT[a-1]:MSHORT[a-1]+"–"+MSHORT[b-1];
}

function annSVG(a){
  if(!a||!a.length) return "";

  a.forEach(([x,y,r],i)=>{
    g+=`<circle class="o" cx="${x*4}" cy="${y*3}" r="${r*4+1.5}"/><circle class="i" cx="${x*4}" cy="${y*3}" r="${r*4-1.5}"/>`;
    const lx=Math.min(94,Math.max(6,x+r*.72)), ly=Math.min(92,Math.max(8,y-r*4/3*.72));
    m+=`<span class="ann-m" style="left:${lx.toFixed(1)}%;top:${ly.toFixed(1)}%">${i+1}</span>`;
  });
  return `<svg class="ann" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true">${g}</svg>${m}`;
}
function legend(a){return a&&a.some(x=>x[3])?`<span class="lgs">${a.map((x,i)=>x[3]?`<span class="lg"><i>${i+1}</i>${esc(x[3])}</span>`:"").join("")}</span>`:""}

function pg(n,size=22,label){const t=label||PGN[n]||n;return `<svg class="pg${size>=40?" lg":""}" viewBox="0 0 24 24" width="${size}" height="${size}" role="img" aria-label="${esc(t)}">${PG[n]||""}</svg>`}

/* ---------- store anatomiske tegninger (kun hvor de lærer noget) ---------- */
function dia(type,hl,o={}){
  const INK="var(--ink)", HL="#D6D6D6";
  const f=p=>hl===p?`fill="${HL}" stroke="${INK}"`:`fill="#fff" stroke="${INK}"`;
  let s="";
  const ground=`<path d="M8 196 H192" stroke="${INK}" stroke-width="1" stroke-dasharray="3 4"/>`;
  if(type==="ribber"){
    s+=`<path d="M28 58 Q100 88 172 58 Q158 108 114 134 L114 198 L86 198 L86 134 Q42 108 28 58 Z" ${f("hat")} stroke-width="1.6"/>`;
    s+=`<path d="M40 80 Q70 110 88 134 M58 88 Q80 112 92 136 M100 92 V138 M142 88 Q120 112 108 136 M160 80 Q130 110 112 134 M48 86 Q66 104 76 116 M152 86 Q134 104 124 116" fill="none" stroke="${INK}" stroke-width="${hl==="under"?2:1.2}"/>`;
    s+=`<ellipse cx="100" cy="60" rx="72" ry="12" ${f("hat")} stroke-width="1.6"/>`;
    s+=`<path d="M86 134 L86 198 L114 198 L114 134" ${f("stok")} stroke-width="1.6"/>`;
  } else {
    const ror=type==="ror";
    const cap=ror?"M22 98 Q24 22 100 20 Q176 22 178 98 Z":"M26 92 Q34 30 100 26 Q166 30 174 92 Z";
    const uy=ror?98:92;
    s+=`<path d="${cap}" ${f("hat")} stroke-width="1.6"/>`;
    const stem=ror?`M80 ${uy+14} Q66 160 76 196 L124 196 Q134 160 120 ${uy+14} Z`:`M91 ${uy+8} L89 196 L111 196 L109 ${uy+8} Z`;
    s+=`<path d="${stem}" ${f("stok")} stroke-width="1.6"/>`;
    if(type==="lameller"){
      s+=`<path d="M26 92 L174 92 Q140 104 100 104 Q60 104 26 92 Z" ${f("under")} stroke-width="1.4"/>`;
      let g="";for(let x=34;x<=166;x+=8){if(x>88&&x<112)continue;g+=`M${x} 92.5 L${x+(100-x)*.12} ${98+(1-Math.abs(x-100)/74)*5}`}
      s+=`<path d="${g}" stroke="${INK}" stroke-width="1"/>`;
    } else if(ror){
      s+=`<path d="M22 98 L178 98 Q150 114 100 114 Q50 114 22 98 Z" ${f("under")} stroke-width="1.4"/>`;
      let g="";for(let x=34;x<=166;x+=7){for(let y=101;y<=110;y+=4.5){if(Math.abs(x-100)<22&&y>104)continue;g+=`<circle cx="${x}" cy="${y+(1-Math.abs(x-100)/78)*3}" r="1.2" fill="${INK}"/>`}}
      s+=g;
    } else if(type==="pigge"){
      let g="";for(let x=32;x<=168;x+=6.5){if(x>88&&x<112)continue;const l=6+(1-Math.abs(x-100)/70)*5;g+=`M${x} 92 L${x+.6} ${92+l}`}
      s+=`<path d="M26 92 L174 92" stroke="${INK}" stroke-width="1.4"/><path d="${g}" stroke="${INK}" stroke-width="1.4"/>`;
    }
    if(o.ring){const ry=type==="lameller"?118:122;
      s+=`<path d="M86 ${ry} Q100 ${ry-5} 114 ${ry} L120 ${ry+12} Q100 ${ry+17} 80 ${ry+12} Z" ${f("ring")} stroke-width="1.4"/>`}
    if(o.volva==="pose") s+=`<path d="M84 170 Q72 198 100 200 Q128 198 116 170 L112 184 L106 172 L100 186 L94 172 L88 184 Z" ${f("basis")} stroke-width="1.4"/>`;
    if(o.volva==="knold") s+=`<ellipse cx="100" cy="188" rx="21" ry="12" ${f("basis")} stroke-width="1.4"/>`;
  }
  return `<svg viewBox="0 0 200 214" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${s}${ground}</svg>`;
}
function diaFor(s,hl){
  const t=s.id==="falsk"?"lameller":s.under;
  return dia(t,hl,{ring:s.k.ring&&s.k.ring[0]==="ja",volva:s.k.basis&&(s.k.basis[0]==="pose"||s.k.basis[0]==="knold")?s.k.basis[0]:null});
}

   ===================================================================== */
function gallery(id,list){
  const all=photos(id); list=list||all;
  if(!list.length) return `<div class="gal"><div class="gal-track"><div class="slide">${phHTML(null,"")}</div></div></div>`;
  const ix=list.map(p=>all.indexOf(p));
  return `<div class="gal" data-sp="${id}" data-ix="${ix.join(",")}">
    <div class="gal-track">${list.map((x,i)=>`<div class="slide">${phHTML(x,"",{lb:id+":"+ix[i],defer:i>0})}</div>`).join("")}</div>
    <div class="arr-btn l"><button aria-label="Forrige billede">${arrow.replace('class="arr"','class="arr back"')}</button></div><div class="arr-btn r"><button aria-label="Næste billede">${arrow}</button></div>
    <div class="gal-meta"><span class="lbl v"></span><span class="gal-n"></span><p class="cap"></p></div>
    <p class="credit"></p>
  </div>`;
}
function initGalleries(root){
  root.querySelectorAll(".gal[data-sp]").forEach(g=>{
    const all=photos(g.dataset.sp), p=g.dataset.ix.split(",").map(i=>all[+i]), tr=$(".gal-track",g), cap=$(".cap",g), v=$(".v",g), n=$(".gal-n",g), cr=$(".credit",g);
    let cur=-1;
    const imgs=[...g.querySelectorAll(".gal-track img")];
    const load=i=>{for(const j of [i,i+1,i-1]){const im=imgs[j];if(im&&im.dataset.src){im.src=im.dataset.src;delete im.dataset.src}}};
    const set=i=>{ if(i===cur)return; cur=i; const x=p[i]; if(!x) return; load(i);
      v.textContent=VIEWN[x.v]||""; cap.innerHTML=`${legend(x.a)}${esc(x.c||"")}`; n.textContent=p.length>1?(i+1)+" / "+p.length:""; cr.textContent=x.by?"Foto: "+x.by:"";
    };
    set(0);
    tr.addEventListener("scroll",()=>set(Math.round(tr.scrollLeft/tr.clientWidth)),{passive:true});
    $(".arr-btn.l button",g).onclick=()=>tr.scrollBy({left:-tr.clientWidth,behavior:"smooth"});
    $(".arr-btn.r button",g).onclick=()=>tr.scrollBy({left:tr.clientWidth,behavior:"smooth"});
    if(p.length<2) g.classList.add("single");
  });
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-lb]"); if(!el) return;
  const [id,i]=el.dataset.lb.split(":"); const p=photos(id)[+i]; if(!p) return;
  showLB(p.s,`${esc(S[id]?S[id].da:"")} — ${esc(VIEWN[p.v]||"")}: ${esc(p.c||"")}`,p.by);
});

    :has("ring","ja")?["ring","Ring"]:has("slim","ja")?["hat","Slimet"]:null;
  if(d) items.push(d);
  const vv=(s.vv||[]).filter(v=>v!=="ved");

function kendetegn(s){

/* =====================================================================
   UNDERSØG — nøglen (morfologi først)
   ===================================================================== */
let K={a:{},step:0,stopShown:false};
function keyQs(){return K.a.under?["under"].concat(FLOW[K.a.under]):["under"]}
function scoreSp(){
  const u=K.a.under;
  let c=SP.filter(s=>u==="vedikke"||!u||s.under===u||s.underAlt===u);
  return c.map(s=>{let sc=0;
    for(const q of FLOW[u]||[]){const a=K.a[q]; if(!a||a==="vedikke")continue;
      let vals=s.k[q];
      if(q==="hab"){ if(a==="bland") vals=(s.k.hab.includes("lov")||s.k.hab.includes("nal"))?["bland"]:[]; else if(a==="skovbund") vals=s.k.hab.includes("traeved")&&s.k.hab.length===1?[]:["skovbund"]; }
      if(!vals) continue;
      const soft=q==="trae"||q==="sted";
      if(vals.includes(a)) sc+=soft?1:2; else sc-=soft?1:3;
    }
    if(s.under===u) sc+=1;
    sc+=relevance(s,area()).inS?.5:-.5;
    return {s,sc};
  }).sort((x,y)=>y.sc-x.sc);

/* =====================================================================
   GEOGRAFI — et let filter/rangeringslag over det samme artsbibliotek.
   GEO[id]: iNaturalist research-grade observationer i et 0,5°-gitter
   (50–66°N, 5°V–30°Ø). 4 tegn pr. celle: indeks (base36, 3 tegn) + antal (0–9).
   GEO.__effort: alle guidens arter samlet = hvor godt området er dækket.
   Kun positive fund tæller: fravær af observationer er ikke bevis for fravær.
   ===================================================================== */
const G={lat0:50,lon0:-5,d:.5,cols:70,rows:32};
function cellOf(lat,lon){const r=Math.floor((lat-G.lat0)/G.d),c=Math.floor((lon-G.lon0)/G.d);if(r<0||c<0||r>=G.rows||c>=G.cols)return -1;return r*G.cols+c}
const GEOC={};
function geoMap(id){if(GEOC[id])return GEOC[id];const m=new Map(),s=(typeof GEO!=="undefined"&&GEO[id])||"";for(let i=0;i+4<=s.length;i+=4)m.set(parseInt(s.substr(i,3),36),+s[i+3]);return GEOC[id]=m}
function nearCount(id,lat,lon){const c0=cellOf(lat,lon);if(c0<0)return null;const r0=Math.floor(c0/G.cols),k0=c0%G.cols,m=geoMap(id);let n=0;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const r=r0+dr,k=k0+dc;if(r>=0&&k>=0&&r<G.rows&&k<G.cols)n+=m.get(r*G.cols+k)||0}return n}
function coverage(a){const n=nearCount("__effort",a.lat,a.lon);return n==null?"ude":n<20?"lav":"god"}

/* Relevans = sæson + skovtype + træer + skovbund + registreret i regionen.
   Understøttende evidens — skjuler aldrig arter og bestemmer aldrig noget. */
function relevance(s,a,month){
  a=a||area(); month=month||new Date().getMonth()+1;
  let sc=0; const why=[]; const m=s.m||[];
  const inS=m.includes(month), edge=m.includes(month%12+1)||m.includes((month+10)%12+1);
  if(inS){sc+=3;why.push("Sæson nu")} else if(edge){sc+=.5;why.push("Kant af sæsonen")} else {sc-=3;why.push("Uden for sæson")}
  const vv=s.vv||[], forest=vv.filter(v=>v!=="ved"), sted=s.k.sted||[];
  const conif=vv.includes("fyr")||vv.includes("gran"), decid=vv.includes("lov")||vv.includes("birk");
  const open=sted.includes("graes")||(s.k.hab||[]).includes("aaben");
  if(a.skov==="nal"){if(conif)sc+=1.5;else if(open&&!forest.length)sc-=1.5;else if(decid)sc-=1}
  if(a.skov==="lov"){if(decid)sc+=1.5;else if(conif)sc-=1;else if(open&&!forest.length)sc-=1}
  if(a.skov==="bland"&&(conif||decid))sc+=1;
  if(a.skov==="aaben"){if(open){sc+=2;why.push("Åbent landskab")}else sc-=1.5}
  const at=[...new Set((a.trees||[]).map(t=>t==="bog"||t==="eg"?"lov":t).filter(t=>t!=="andre"))];
  if(at.length&&forest.length){const hit=forest.filter(v=>at.includes(v));
    if(hit.length){sc+=2;why.push("Ved "+hit.map(v=>({fyr:"fyr",gran:"gran",birk:"birk",lov:"løvtræ"})[v]).join("/"))} else sc-=1.5}
  const sb=(s.bund||[]).concat(sted), bm={mos:"mos",naale:"naale",graes:"graes",sand:"sand",blade:"jord"};
  if((a.bund||[]).some(x=>sb.includes(bm[x])))sc+=.5;
  const n=nearCount(s.id,a.lat,a.lon);
  if(n>0){sc+=2;why.push("Registreret i regionen")}
  return {sc,why,n,inS};
}

function watchList(a){
  const r=ranked(SP,a); const top=r.slice(0,10);

  for(const x of r.slice(10)){ if(d>=3)break; if(isDanger(x.s)&&x.r.inS){for(let i=top.length-1;i>=0;i--){if(!isDanger(top[i].s)){top.splice(i,1);break}} top.push(x);d++} }

}

async function shrink(file,max,q){
  const url=URL.createObjectURL(file);
  try{const img=new Image();img.src=url;await img.decode();
    let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));c.width=c.height=0;return {blob,w,h};
  }finally{URL.revokeObjectURL(url)}
}

  navigator.serviceWorker.controller.postMessage({type:"precache",urls},[ch.port2]);
}

    case "forskelle": return {v:V.pairs(),root:true,tab:"forskelle"};
    case "forskel": return {v:V.pair(b),t:"Se forskellen",tab:"forskelle",pair:true};
    case "noegle": return {v:V.key(),root:true,tab:"noegle",key:true};
    case "quiz": return {v:V.quiz(),t:"Start",tab:"hjem",quiz:true};
    case "registrer": {
      const mode=b==="ret"?"ret:"+c:b==="art"?"art:"+c:"ny";
      if(!REG||REG.mode!==mode){ if(b==="ret") return {v:`<p class="meta pad" style="padding-top:48px">Henter …</p>`,t:"Fund",tab:"fund",loadEdit:c,mode};
        newReg(b==="art"?c:null); REG.mode=mode; }
      return {v:V.reg(),t:"Fund",tab:"fund",reg:true};
    }
    case "fund": if(b) return {v:V.find(b),t:"Fund",tab:"fund",find:b};
      return {v:V.finds(),root:true,tab:"fund",finds:true};
    case "info": return {v:V.info(),t:"Start",tab:"hjem",info:true};
    default: return {v:V.home(),root:true,tab:"hjem",home:true};
  }
}
let lastHash=null;
function render(keepScroll){
  const r=route();
  const y=window.scrollY;
  document.body.classList.toggle("kitchen",!!r.kitchen);
  document.querySelector('meta[name="theme-color"]').content=r.kitchen?"#F6E8B1":"#FFFFFF";
  app.innerHTML=`<div class="view">${r.v}</div><footer class="foot"><span class="wmk">Svampeguiden</span><p>Et foto eller en nøgle kan ikke afgøre, om en svamp kan spises. Spis kun svampe, der er sikkert bestemt af en kyndig.</p><a href="#/info">Sikkerhed og kilder ${arrow}</a><small>Testversion · Opdateret ${UPDATED}</small></footer>`;
  $("#ttl").textContent=r.t||"";
  $("#top").classList.toggle("root",!!r.root);
  $("#reg").style.visibility=(r.reg||r.loadEdit)?"hidden":"visible";
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.t===r.tab));
  initGalleries(app);
  if(r.key) bindKey(app);
  if(r.quiz) bindQuiz(app);
  if(r.finds) bindFinds(app);
  if(r.find) bindFind(app,r.find);
  if(r.reg) bindReg(app);
  if(r.loadEdit) editReg(r.loadEdit).then(ok=>{if(ok){REG.mode=r.mode;render()}else location.hash="#/fund"});
  if(r.list) bindFilters(app);
  if(r.pair){const hd=$(".cmp-head",app),nm=$(".ab-names",app);if(hd&&nm&&"IntersectionObserver" in window){new IntersectionObserver(([e])=>hd.classList.toggle("show",!e.isIntersecting&&e.boundingClientRect.top<0)).observe(nm)}}
  if(r.info){
    const rs=$("#resetAll");if(rs)rs.onclick=async()=>{if(confirm("Slet alle fund, billeder, valgt område og quiz-resultater på denne enhed?")){await DB.clear().catch(()=>{});["omraade","omraader","quizBest","quizRounds","fund_migreret"].forEach(k=>{try{localStorage.removeItem("svampe."+k)}catch(e){}});await loadFinds();render()}};
    const pc=$("#precache");if(pc)pc.onclick=()=>precacheImages(pc);
  }
  app.querySelectorAll("[data-jump]").forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.getElementById(a.dataset.jump);if(t)window.scrollTo({top:t.getBoundingClientRect().top+scrollY-70,behavior:"smooth"})});
  if(keepScroll) window.scrollTo(0,y); else if(location.hash!==lastHash) window.scrollTo(0,0);
  lastHash=location.hash;
}
function foundTodayIds(){const d=dayKey(Date.now());return new Set(FINDS.filter(f=>dayKey(f.created)===d&&f.ident&&f.ident.species).map(f=>f.ident.species))}
function updBadge(){
  const d=dayKey(Date.now()), n=FINDS.filter(f=>dayKey(f.created)===d).length, a=$('#tabs a[data-t="fund"]');
  let b=a.querySelector(".n"); if(!n){b&&b.remove();return}
  if(!b){b=document.createElement("span");b.className="n";a.appendChild(b)} b.textContent=n;
}
document.addEventListener("click",e=>{if(e.target.closest("[data-area]")){e.preventDefault();openArea()}});
$("#back").onclick=()=>{if(history.length>1&&lastHashStack>0){history.back()}else location.hash="#/"};
let lastHashStack=0;
window.addEventListener("hashchange",()=>{lastHashStack++;const st=document.getElementById("stop");if(st)st.remove();render()});
const topUpd=()=>{$("#top").classList.toggle("scrolled",scrollY>4)};window.addEventListener("scroll",topUpd,{passive:true});
try{localStorage.removeItem("svampe.felt")}catch(e){}
render();
migrateOld().then(loadFinds).then(()=>{if(location.hash===""||location.hash==="#/"||location.hash.startsWith("#/arter"))render(true)});
if("serviceWorker" in navigator&&location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
